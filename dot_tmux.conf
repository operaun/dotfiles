# =============================================================================
# Tmux Configuration (managed by chezmoi)
# =============================================================================

# -----------------------------------------------------------------------------
# 기본 설정
# -----------------------------------------------------------------------------
# 256 색상 지원
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 마우스 지원
set -g mouse on

# 히스토리 버퍼 크기
set -g history-limit 50000

# 창 재정렬 자동화
set -g renumber-windows on

# 응답 시간 개선 (Escape 지연 제거)
set -sg escape-time 0

# 포커스 이벤트 활성화 (Neovim 연동)
set -g focus-events on

# -----------------------------------------------------------------------------
# 키 바인딩
# -----------------------------------------------------------------------------
# Prefix 키: Ctrl+a (기본 Ctrl+b 대체)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 설정 리로드: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 창 분할: 직관적인 키
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane 이동: Vim 스타일 (hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane 크기 조절: Vim 스타일
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 새 창: 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# 복사 모드 (Vi 스타일)
# -----------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# -----------------------------------------------------------------------------
# 상태 바 스타일링 (간결)
# -----------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=cyan,bold] #S "
set -g status-right "#[fg=yellow]%H:%M "
set -g status-left-length 20
set -g window-status-format "#[fg=gray] #I:#W "
set -g window-status-current-format "#[fg=cyan,bold] #I:#W "

# Pane 테두리
set -g pane-border-style "fg=gray"
set -g pane-active-border-style "fg=cyan"

# 메시지 스타일
set -g message-style "bg=default,fg=yellow"
